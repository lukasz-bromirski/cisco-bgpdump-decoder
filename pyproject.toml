[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cisco-bgpdump"
version = "1.0.0"
description = "Decode Cisco IOS/IOS-XE %BGP-x-MSGDUMP syslog hexdumps to text, JSON or pcap"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Lukasz Bromirski" }]
keywords = ["bgp", "cisco", "ios-xe", "syslog", "pcap", "networking"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.scripts]
cisco-bgpdump = "bgpdump.cli:main"

[tool.setuptools]
packages = ["bgpdump", "bgpdump.render"]
